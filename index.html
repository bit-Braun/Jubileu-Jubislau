<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trabalho de Casa</title>
    <style>
      body {
        font-family: impact , serif;
        margin: 0;
        padding: 0;
        background: #fbf4f4;
        color: #222;
      }

      .container {
        max-width: 800px;
        margin: 40px auto;
        padding: 24px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 18px rgba(3, 2, 2, 0.3);
      }

      h1 {
        color: #2b6cb0;
        margin-bottom: 10px;
        text-shadow: 1px 10px 8px rgba(0, 0, 0, 0.3);
      }

      p {
        line-height: 1.8;
        font-size: 26px;
      }

      .box {
        background: #95b9df5b;
        padding: 15px;
        border-radius: 8px;
        margin-top: 20px;
      }

      ul {
        padding-left: 20px;
        font-size: 36px;
        color: #6f97c2;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>My Homework Website</h1>
      <p>This is a simple website I made for school homework.</p>

      <div class="box">
        <h2>What I learned</h2>
        <ul>
          <li>How to make a webpage</li>
          <li>How to use basic HTML</li>
          <li>How to style a page with CSS</li>
        </ul>
      </div>

      <div class="box">
        <h2>About this project</h2>
        <p>This page is clean, easy to read, and simple to change for your homework.</p>
      </div>
    </div>
  </body>
</html>
